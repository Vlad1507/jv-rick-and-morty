databaseChangeLog:
  - changeSet:
      id: create-cartoon_characters_origin-table
      author: vlad_a
      changes:
        createTable:
          tableName: cartoon_characters_origin
          columns:
            - column:
                name: origin_id
                type: bigint
                constraints:
                  nullable: false
                  foreignKeyName: fk_origin
                  referencedTableName: character_origin
                  referenceColumnName: id
            - column:
                name: origin_name
                type: varchar(255)
                constraints:
                  referencedTableName: character_origin
                  referenceColumnName: name