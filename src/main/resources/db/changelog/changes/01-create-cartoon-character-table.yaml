databaseChangeLog:
  - changeSet:
      id: create-cartoon-character-table
      author: vlad_a
      changes:
        createTable:
          tableName: cartoon_characters
          columns:
            - column:
                name: id
                type: bigint
                autoIncrement: true
                constraints:
                  primaryKey: true
                  nullable: false
            - column:
                name: external_id
                type: varchar(255)
                constraints:
                  nullable: false
            - column:
                name: name
                type: varchar(255)
            - column:
                name: status
                type: varchar(255)
                constraints:
                  nullable: false
            - column:
                name: species
                type: varchar(255)
                constraints:
                  nullable: false
            - column:
                name: type
                type: varchar(255)
                constraints:
                  nullable: false
            - column:
                name: gender
                type: varchar(255)
                constraints:
                  nullable: false
            - column:
                name: origin_name
                type: varchar(255)
                constraints:
                  foreignKeyName: fk_origin
                  reference: character_origin(name)
            - column:
                name: location_name
                type: varchar(255)
                constraints:
                  foreignKeyName: fk_location
                  reference: locations(name)
            - column:
                name: image
                type: varchar(255)
            - column:
                name: character_url
                type: varchar(255)
            - column:
                name: created_date
                type: varchar(255)
            - column:
                name: is_deleted
                type: boolean
                defaultValueBoolean: false
                constraints:
                  nullable: false
